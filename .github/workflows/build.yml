name: Build Munawar AI APK

on:
  push:
    branches: [ '**' ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find the Gradle project (works even if the folder was uploaded one level deep)
        id: proj
        run: |
          F=$(find . -maxdepth 3 -name settings.gradle.kts -not -path './node_modules/*' | head -1)
          if [ -z "$F" ]; then echo "::error::settings.gradle.kts not found. Upload the CONTENTS of the zip (settings.gradle.kts, app/, .github/ ...) to the repo root."; exit 1; fi
          D=$(dirname "$F")
          echo "dir=$D" >> "$GITHUB_OUTPUT"
          echo "Gradle project: $D"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-34 build-tools;34.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Decode signing key (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Using your release keystore."
          else
            echo "No KEYSTORE_BASE64 secret: using the bundled keystore/munawar-ci.jks (stable signature)."
          fi

      - name: 1) Compile Kotlin code (any code error is shown at the END of this step)
        id: kotlin
        run: |
          set -o pipefail
          gradle -p "${{ steps.proj.outputs.dir }}" compileReleaseKotlin --console=plain --no-daemon 2>&1 | tee "$RUNNER_TEMP/kotlin.log"

      - name: Code errors (shown even if you do not open the logs)
        if: failure() && steps.kotlin.outcome == 'failure'
        run: |
          grep -E "^e: " "$RUNNER_TEMP/kotlin.log" | sed 's#file://##' | head -30 | while IFS= read -r line; do echo "::error::$line"; done
          {
            echo "## Kotlin code errors"
            echo '```'
            grep -E "^e: " "$RUNNER_TEMP/kotlin.log" | sed 's#file://##' | head -40
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cp "$RUNNER_TEMP/kotlin.log" kotlin-errors.log || true

      - name: 2) Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -o pipefail
          gradle -p "${{ steps.proj.outputs.dir }}" assembleRelease --console=plain --no-daemon 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Packaging / resource errors (only if step 2 failed)
        if: failure() && steps.kotlin.outcome == 'success'
        run: |
          grep -E "What went wrong|Execution failed|AAPT|error:|Caused by|Could not|Duplicate|FAILED" "$RUNNER_TEMP/build.log" | head -30 | while IFS= read -r line; do echo "::error::$line"; done
          {
            echo "## Build failed after the Kotlin step"
            echo '```'
            grep -E "What went wrong|Execution failed|AAPT|error:|Caused by|Could not|Duplicate" -A2 "$RUNNER_TEMP/build.log" | head -60
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cp "$RUNNER_TEMP/build.log" build.log || true

      - name: Upload logs (only if something failed)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            build.log
            kotlin-errors.log
            **/build/reports
          if-no-files-found: ignore

      - name: Collect APK
        run: |
          APK=$(find "${{ steps.proj.outputs.dir }}/app/build/outputs/apk/release" -name '*.apk' | head -1)
          echo "APK: $APK"
          cp "$APK" MunawarAI.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MunawarAI-apk
          path: MunawarAI.apk
          if-no-files-found: error

      - name: Publish GitHub Release (tags like v0.7.0)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: MunawarAI.apk
          generate_release_notes: true
